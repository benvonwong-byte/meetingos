<!DOCTYPE html>
<html><head><meta charset="utf-8"></head><body><script>
  var id   = localStorage.getItem('dc_record_id') || '';
  var name = localStorage.getItem('dc_user_name') || '';
  if (window.parent !== window) {
    window.parent.postMessage(
      { type: 'dc_identity', recordId: id, name: name },
      'https://info.dearcrisis.com'
    );
  }
</script></body></html>
